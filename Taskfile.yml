version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  dev:
    desc: Run app in dev mode with hot reload
    deps: [generate:bindings]
    cmds:
      - go tool wails3 dev -config ./build/config.yml -port 9245

  generate:bindings:
    desc: Regenerate frontend bindings from Go services
    cmds:
      - go tool wails3 generate bindings -d ./bindings -ts

  generate:sqlc:
    desc: Generate Go code from SQL via sqlc
    cmds:
      - sqlc generate

  migrate:
    desc: Run goose migrations, e.g. task migrate -- -db ./neoprojector.db up
    cmds:
      - go run ./cmd/migrate {{.CLI_ARGS}}

  build:mac:
    desc: Universal macOS build (Intel + Apple Silicon)
    deps: [generate:bindings]
    cmds:
      - go tool wails3 build -clean -platform darwin/universal

  build:windows:
    desc: Windows build
    deps: [generate:bindings]
    cmds:
      - go tool wails3 build -clean -platform windows/amd64

  build:linux:
    desc: Linux build
    deps: [generate:bindings]
    cmds:
      - go tool wails3 build -clean -platform linux/amd64

  build:all:
    desc: Build for all platforms
    deps: [build:mac, build:windows, build:linux]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build/bin
      - rm -rf dist
      - rm -rf node_modules
      - rm -rf bindings
