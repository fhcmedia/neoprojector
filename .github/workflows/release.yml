name: Release

# Triggers:
#   - push to main: build all three platforms and publish a STABLE
#     release versioned `<major>.<minor>.<run-number>` (major.minor
#     from build/config.yml). Every push is a release that installed
#     copies pick up at their next launch — the splash updater follows
#     releases/latest. Old beta installs (0.1.0-beta.N) move onto it
#     too: 0.1.0-beta.N < 0.1.0 < 0.1.<run-number>.
#   - push of a tag matching `v*`: the same, at exactly that version,
#     for a deliberate bump. Bump build/config.yml's minor to match
#     afterwards, or later pushes (0.1.<run>) would rank below it and
#     never reach installs.
#
# The release body starts with a "What's new" list built from the
# commit subjects since the previous release; the app shows it in its
# post-update notification (features/whats-new).
on:
  push:
    branches: [main]
    tags: ["v*"]

# Cancel an in-progress run if a new push lands on the same ref — the
# newer push supersedes it, and its notes still include the cancelled
# commits (they're listed from the last *published* tag).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required for softprops/action-gh-release

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  # --- version: decides the tag + prerelease flag once so every -----------
  # downstream build sees the same value. Outputs feed into needs.* in the
  # build and release jobs.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags, to list the commits since the last release.
          fetch-depth: 0
      - id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            # major.minor from build/config.yml — the single source of
            # truth for the version line; the patch is the run number,
            # so every push gets a unique, ever-increasing version.
            BASE=$(awk -F'"' '/^  version:/ {print $2}' build/config.yml)
            if [[ -z "$BASE" ]]; then
              echo "could not read version from build/config.yml" >&2
              exit 1
            fi
            MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1,2)
            VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Building $TAG"
      - id: notes
        shell: bash
        run: |
          set -euo pipefail
          # User-facing commit subjects (feat/fix/perf) since the
          # previous release tag: "fix(media): stop the x" -> "- Stop the x".
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          git log --no-merges --pretty='%s' "${PREV:+$PREV..}HEAD" \
            | grep -E '^(feat|fix|perf)(\([^)]*\))?!?: ' \
            | sed -E 's/^[a-z]+(\([^)]*\))?!?: //; s/^(.)/\U\1/; s/^/- /' \
            | head -30 > notes.md || true
          if [[ ! -s notes.md ]]; then
            echo "- Improvements and fixes" > notes.md
          fi
          cat notes.md
          {
            echo "notes<<NOTES_EOF"
            cat notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # --- macOS: universal .app bundle ---------------------------------------
  # We lipo the arm64 + amd64 binaries together so one .app runs on
  # Intel and Apple Silicon. The bundle is zipped (not codesigned) —
  # downloaders right-click → Open the first time to bypass Gatekeeper.
  build-mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # database/seed/*.json are Git LFS-tracked (~8MB each). Without
          # this flag the runner gets the pointer files instead of the
          # actual JSON, embed.FS bakes the pointers into the binary, and
          # the bible seed errors on first launch with "invalid character
          # 'v' looking for beginning of value" (the 'v' is from "version
          # https://git-lfs.github.com/spec/v1").
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build universal macOS bundle
        # VERSION is stamped into the binary (main.version) so the
        # auto-updater can compare itself against releases/latest.
        run: task build:mac:universal VERSION=${{ needs.version.outputs.version }}
      - name: Package .app bundle
        run: |
          cd bin
          zip -ryq "neoprojector-${{ needs.version.outputs.version }}-mac.zip" \
            "NeoProjector.app"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: bin/neoprojector-*-mac.zip
          retention-days: 7

  # --- Windows: .exe ------------------------------------------------------
  # No NSIS installer yet — distribute the raw .exe in a zip. CGO is
  # supplied by the runner's mingw-w64. SmartScreen will warn on first
  # launch (no code-signing cert), users click through.
  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # database/seed/*.json are Git LFS-tracked (~8MB each). Without
          # this flag the runner gets the pointer files instead of the
          # actual JSON, embed.FS bakes the pointers into the binary, and
          # the bible seed errors on first launch with "invalid character
          # 'v' looking for beginning of value" (the 'v' is from "version
          # https://git-lfs.github.com/spec/v1").
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Windows tar+zstd over a populated Go mod cache hangs for
          # 5+ min in post-job cleanup (known setup-go issue on
          # Windows runners). Re-downloading modules each run costs
          # ~1 min, so the trade pays for itself.
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Windows .exe
        shell: bash
        run: task build:windows VERSION=${{ needs.version.outputs.version }}
      - name: Package .exe
        shell: bash
        run: |
          cd bin
          7z a "neoprojector-${{ needs.version.outputs.version }}-windows.zip" neoprojector.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: bin/neoprojector-*-windows.zip
          retention-days: 7

  # --- Linux: tar.gz of the binary ----------------------------------------
  # GTK4 + WebKitGTK 6.0 headers are required for Wails v3 alpha on
  # Linux. Anything older silently links a stub and crashes at start.
  # AppImage packaging is a follow-up — for now ship the binary in a
  # tarball; users `chmod +x` and run.
  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK + WebKitGTK dev packages
        # GTK4 + WebKitGTK 6.0 are what our app links against (Wails v3
        # alpha's GTK4 backend). The 3.x packages are also required —
        # `go tool wails3` compiles the wails3 CLI on first use, and
        # its internal/operatingsystem package pulls in gtk+-3.0 and
        # webkit2gtk-4.1 via pkg-config regardless of the build target.
        # Without them the bindings-generate step fails on Linux.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Linux binary
        run: task build:linux VERSION=${{ needs.version.outputs.version }}
      - name: Package binary
        run: |
          cd bin
          tar -czf "neoprojector-${{ needs.version.outputs.version }}-linux.tar.gz" neoprojector
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: bin/neoprojector-*-linux.tar.gz
          retention-days: 7

  # --- Release: download all three artifacts and publish ------------------
  release:
    needs: [version, build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts/
      # Stable releases also carry version-less duplicates so external
      # links never need updating:
      #   github.com/fhcmedia/neoprojector/releases/latest/download/neoprojector-mac.zip
      # (`releases/latest/download/` resolves by asset NAME, so the
      # name must be identical across releases.)
      - name: Add stable-named assets
        if: needs.version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cp "artifacts/neoprojector-${VERSION}-mac.zip"        artifacts/neoprojector-mac.zip
          cp "artifacts/neoprojector-${VERSION}-windows.zip"    artifacts/neoprojector-windows.zip
          cp "artifacts/neoprojector-${VERSION}-linux.tar.gz"   artifacts/neoprojector-linux.tar.gz
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          # Replace existing release artifacts when re-running the
          # same tag — useful when an Action retry doesn't actually
          # mean "a new release is intended."
          fail_on_unmatched_files: true
          # Everything in artifacts/ — the three versioned archives,
          # plus the stable-named duplicates on stable releases.
          files: artifacts/*
          # The app's post-update notification reads the list under
          # "## What's new" (up to the next heading or ---); keep it first.
          body: |
            ## What's new
            ${{ needs.version.outputs.notes }}

            ---
            Built from `${{ github.sha }}` on `${{ github.ref }}`.

            **Artifacts**
            - `neoprojector-${{ needs.version.outputs.version }}-mac.zip` — universal .app bundle (Intel + Apple Silicon)
            - `neoprojector-${{ needs.version.outputs.version }}-windows.zip` — Windows .exe
            - `neoprojector-${{ needs.version.outputs.version }}-linux.tar.gz` — Linux binary

            On first launch macOS/Windows users may need to bypass
            Gatekeeper / SmartScreen — this build is not yet signed.

            Installed copies pick this release up automatically at their
            next launch (the splash-screen updater follows
            `releases/latest`).
