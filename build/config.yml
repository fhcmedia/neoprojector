# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

info:
  companyName: "Fathers House Church Media"
  productName: "neoprojector"
  productIdentifier: "org.fhcmedia.neoprojector"
  description: "Church presentation software"
  copyright: "(c) 2025, Fathers House Church Media"
  comments: "Church presentation software"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - bin
      - dist
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: pnpm install
      type: once
    - cmd: pnpm dev
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: go build -o ./bin/neoprojector.exe .
      type: blocking
    - cmd: ./bin/neoprojector.exe
      type: primary

fileAssociations: []

other: []
